name: S00 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  s00-offline:
    name: s00-offline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: spikes/s00-mcp
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: spikes/s00-mcp/package-lock.json

      - name: Pin npm and report versions
        run: |
          npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test offline behavior
        run: npm test

      - name: Build Node and Worker artifacts
        run: npm run build

      - name: Test built artifacts
        run: npm run test:build
